<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b13"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Ledger Book -->
  <rect x="12" y="16" width="38" height="30" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="14" y="18" width="16" height="26" rx="2" fill="#f8fafc"/>
  <rect x="32" y="18" width="16" height="26" rx="2" fill="#e2e8f0"/>
  <line x1="30" y1="17" x2="30" y2="45" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Ledger Lines -->
  <line x1="17" y1="24" x2="27" y2="24" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="17" y1="29" x2="27" y2="29" stroke="#94a3b8" stroke-width="1"/>
  <line x1="17" y1="34" x2="27" y2="34" stroke="#94a3b8" stroke-width="1"/>
  <line x1="17" y1="39" x2="27" y2="39" stroke="#94a3b8" stroke-width="1"/>

  <!-- Gold Rupee Coin -->
  <circle cx="42" cy="40" r="14" fill="url(#gold)" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="42" cy="40" r="11.5" fill="none" stroke="#fef08a" stroke-width="0.8"/>

  <!-- Rupee Symbol -->
  <text x="42" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>

  <!-- Success Indicator -->
  <circle cx="28" cy="44" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
  <path d="M26 44l1.5 1.5 3-3" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
